<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Khẩu ngữ" />
  <meta name="theme-color" content="#dc2626" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23dc2626'/><text x='50%' y='68%' font-size='56' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>说</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23dc2626'/><text x='50%' y='68%' font-size='56' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>说</text></svg>" />
  <title>Khẩu ngữ Trung cấp · Copy nhanh cho Doubao</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header cố định trên mobile -->
  <header class="app-header">
    <div class="header-main">
      <div class="brand">
        <span class="logo">说</span>
        <div>
          <h1>Khẩu ngữ Trung cấp</h1>
          <p class="subtitle">汉语口语速成 · 13 Đề thi</p>
        </div>
      </div>
      <button class="btn btn-prompt" id="btnCopyGeneralPrompt" title="Copy prompt chung để dán vào Doubao">
        <span class="icon">📋</span>
        <span class="label">Prompt chung</span>
      </button>
    </div>

    <!-- Thanh tìm kiếm & tùy chọn hiển thị -->
    <div class="header-tools">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" placeholder="Tìm đề, câu hỏi, từ khóa..." autocomplete="off" />
        <button id="btnClearSearch" class="btn-clear" hidden>×</button>
      </div>
      <label class="toggle-pill" id="pinyinToggleLabel" title="Bật/tắt phiên âm pinyin">
        <input type="checkbox" id="pinyinToggle" checked />
        <span class="toggle-track"></span>
        <span class="toggle-text">Pinyin</span>
      </label>
    </div>

    <!-- Danh mục bài học (ngang, lướt ngón tay tiện lợi) -->
    <nav class="lesson-chips" id="lessonChips"></nav>
  </header>

  <!-- Nội dung danh sách bài & đề thi -->
  <main class="main-content" id="topicListContainer">
    <!-- Render bằng JS -->
  </main>

  <!-- Modal xem Từ vựng & Mẫu câu -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal-sheet" id="modalSheet" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modalTitle">Từ vựng & Mẫu câu</h3>
        <button class="modal-close" id="btnModalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Render bằng JS -->
      </div>
    </div>
  </div>

  <!-- Toast thông báo đã copy -->
  <div class="toast" id="toast" hidden></div>

  <!-- Nạp dữ liệu & script điều khiển -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
