<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Khẩu ngữ" />
  <meta name="theme-color" content="#18181b" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2318181b'/><text x='50%' y='68%' font-size='56' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>说</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2318181b'/><text x='50%' y='68%' font-size='56' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>说</text></svg>" />
  <title>Khẩu ngữ Tiếng Trung · Copy nhanh cho Doubao</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header cố định trên mobile & desktop -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-top-bar">
        <div class="brand">
          <span class="logo">说</span>
          <div>
            <h1 id="appTitle">Khẩu ngữ Tiếng Trung</h1>
            <p class="subtitle" id="appSubtitle">汉语口语教程 · 5 Bài · 13 Tình huống</p>
          </div>
        </div>

        <!-- Chọn giáo trình / môn học -->
        <div class="book-nav" id="bookNav">
          <div class="book-tabs" role="tablist" aria-label="Chọn môn giáo trình">
            <button type="button" class="book-tab active" data-book="giao-trinh" id="tabGiaoTrinh" role="tab" aria-selected="true">
              <span class="book-tab-icon">📖</span>
              <span class="book-tab-text">汉语口语教程</span>
            </button>
            <button type="button" class="book-tab" data-book="trung-cap" id="tabTrungCap" role="tab" aria-selected="false">
              <span class="book-tab-icon">📕</span>
              <span class="book-tab-text">汉语口语速成</span>
            </button>
          </div>
        </div>

        <div class="header-top-actions">
          <button class="btn btn-prompt" id="btnCopyGeneralPrompt" title="Copy prompt chung để dán vào Doubao">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span class="label">Prompt chung</span>
          </button>
        </div>
      </div>

      <!-- Thanh tìm kiếm & tùy chọn hiển thị -->
      <div class="header-tools">
        <div class="search-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="searchInput" placeholder="Tìm đề, từ khóa... (phím /)" autocomplete="off" />
          <kbd class="search-kbd-hint" title="Nhấn phím / để tìm nhanh">/</kbd>
          <button id="btnClearSearch" class="btn-clear" hidden>×</button>
        </div>

        <div class="header-toggles">
          <div class="version-toggle" id="versionToggle" role="group" aria-label="Chọn phiên bản nội dung">
            <button type="button" class="v-btn" data-v="v1" title="Bản gốc nguyên bản">V1 Gốc</button>
            <button type="button" class="v-btn active" data-v="v2" title="Bản tối ưu lồng ghép mẫu câu">V2 Tối ưu</button>
          </div>
          <label class="toggle-pill" id="pinyinToggleLabel" title="Bật/tắt phiên âm pinyin">
            <input type="checkbox" id="pinyinToggle" checked />
            <span class="toggle-track"></span>
            <span class="toggle-text">Pinyin</span>
          </label>
          <label class="toggle-pill" id="viToggleLabel" title="Bật/tắt bản dịch tiếng Việt">
            <input type="checkbox" id="viToggle" checked />
            <span class="toggle-track"></span>
            <span class="toggle-text">Dịch</span>
          </label>
        </div>
      </div>

      <!-- Danh mục bài học (ngang, lướt ngón tay tiện lợi) -->
      <nav class="lesson-chips" id="lessonChips"></nav>
    </div>
  </header>

  <!-- Nội dung danh sách bài & đề thi -->
  <main class="main-content" id="topicListContainer">
    <!-- Render bằng JS -->
  </main>

  <!-- Modal xem Từ vựng & Mẫu câu -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal-sheet" id="modalSheet" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modalTitle">Từ vựng & Mẫu câu</h3>
        <button class="modal-close" id="btnModalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Render bằng JS -->
      </div>
    </div>
  </div>

  <!-- Modal đối chiếu V1 (Gốc) ↔ V2 (Tối ưu) -->
  <div class="modal-backdrop" id="compareModalBackdrop" hidden>
    <div class="modal-sheet modal-sheet-compare" id="compareModalSheet" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div class="compare-header-info">
          <span class="compare-badge">Bản đối chiếu</span>
          <h3 id="compareModalTitle">Đối chiếu V1 ↔ V2</h3>
        </div>
        <button class="modal-close" id="btnCompareModalClose">✕</button>
      </div>
      <div class="modal-body" id="compareModalBody">
        <!-- Render bằng JS -->
      </div>
    </div>
  </div>

  <!-- Nút cuộn lên đầu trang cho desktop & mobile -->
  <button type="button" class="btn-back-to-top" id="btnBackToTop" title="Cuộn lên đầu trang" hidden aria-label="Cuộn lên đầu trang">
    <span>↑</span>
  </button>

  <!-- Toast thông báo đã copy -->
  <div class="toast" id="toast" hidden></div>

  <!-- Nạp dữ liệu & script điều khiển -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
